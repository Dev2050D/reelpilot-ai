services:
  - type: web
    name: reelpilot-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHECK_INTERVAL_MINUTES
        value: "30"
      - key: AUTO_PUBLISH
        value: "true"
      - key: SOURCE_PROFILE_URL
        value: "https://www.instagram.com/aoonoww/"
      - key: META_GRAPH_VERSION
        value: "v23.0"
      - key: OPENAI_MODEL
        value: "gpt-4.1-mini"
      - key: DATABASE_PATH
        value: "/var/data/reelpilot.db"
    disk:
      name: reelpilot-data
      mountPath: /var/data
      sizeGB: 1
